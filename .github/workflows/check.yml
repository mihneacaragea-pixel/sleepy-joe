name: Verifica anunturi apartamente Craiova

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependintele
        run: pip install -r requirements.txt

      - name: Ruleaza scriptul de verificare
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salveaza starea (seen_ids.json) inapoi in repo
        run: |
          git config user.name "apartment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "update seen ids [skip ci]"
          git push
